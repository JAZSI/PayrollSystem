spring.application.name=PayrollSystem

# --- SQLite datasource ---
spring.datasource.url=jdbc:sqlite:payroll.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# --- JPA / Hibernate (SQLite community dialect) ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- Web ---
server.port=8080

# --- OpenAPI / Swagger UI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# --- JWT / auth ---
# NOTE: override via environment variable APP_JWT_SECRET in production.
app.jwt.secret=${APP_JWT_SECRET:change-me-please-this-is-a-dev-only-secret-key-32b+}
app.jwt.expiration-ms=86400000
# Default admin seeded on first run (change after first login).
app.admin.username=admin
app.admin.password=admin123
# CORS allowed origin for the React dev server.
app.cors.allowed-origin=http://localhost:5173
