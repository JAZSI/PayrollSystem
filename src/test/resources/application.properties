# Tests run against a shared in-memory SQLite — never the real payroll.db.
spring.datasource.url=jdbc:sqlite:file:payroll-test?mode=memory&cache=shared
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.open-in-view=false

app.jwt.secret=test-only-secret-key-at-least-32-bytes-long-xx
app.jwt.expiration-ms=86400000
app.admin.username=admin
app.admin.password=admin123
app.cors.allowed-origin=http://localhost:5173
